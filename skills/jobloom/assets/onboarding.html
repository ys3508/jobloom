<!doctype html>
<meta charset="utf-8">
<title>Jobloom</title>
<!--
  The onboarding window. It renders what the local service gives it and decides nothing: every
  rule it appears to apply - which fields are asked, what a valid email is, what the two
  confirmations mean, what registering costs - is enforced in `candidate_profile` and re-checked
  there. A page that could be edited into skipping a gate would be a page holding the gate.

  Values live here only while the window is open. Nothing is stored in the browser, nothing is
  sent anywhere but the loopback service that opened this page, and the page loads no font,
  script or image from outside itself.
-->
<style>
  :root {
    --ink: #1a1c1f; --muted: #6b7280; --line: #e3e6ea; --bg: #f6f7f9;
    --card: #ffffff; --accent: #1f6feb; --accent-ink: #ffffff;
    --warn: #8a5a00; --warn-bg: #fff8e6; --good: #146c2e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e9ecef; --muted: #9aa4b2; --line: #2b3038; --bg: #14161a;
      --card: #1c1f24; --accent: #4c8dff; --accent-ink: #0b0d10;
      --warn: #f0c674; --warn-bg: #2a2418; --good: #6fcf8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 620px; margin: 0 auto; padding: 32px 24px 80px; }
  header.bar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
  header.bar h1 { font-size: 17px; margin: 0; letter-spacing: .01em; }
  header.bar .spacer { flex: 1; }
  select { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line);
           border-radius: 6px; padding: 3px 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 28px; }
  h2 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: 13.5px; }
  .progress { display: flex; gap: 4px; margin-bottom: 22px; }
  .progress i { flex: 1; height: 3px; border-radius: 2px; background: var(--line); }
  .progress i.done { background: var(--accent); }
  label.field { display: block; font-weight: 600; margin: 0 0 4px; }
  .row { margin: 18px 0; }
  .row .origin:first-of-type { margin: -2px 0 6px; }
  input[type=text] {
    width: 100%; font: inherit; color: inherit; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .origin { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .complaint { color: var(--warn); font-size: 13.5px; margin-top: 8px; }
  .offer { background: var(--warn-bg); border: 1px solid var(--line); border-radius: 8px;
           padding: 10px 12px; margin-top: 10px; font-size: 13.5px; }
  .gate { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 22px; }
  .gate p { margin: 0 0 8px; font-weight: 600; }
  .choices { display: flex; gap: 8px; }
  button {
    font: inherit; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink);
                              border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary[disabled] { opacity: .45; cursor: not-allowed; }
  button.link { border: none; background: none; color: var(--accent); padding: 0; }
  footer.nav { display: flex; gap: 10px; align-items: center; margin-top: 28px; }
  footer.nav .spacer { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 8px 0; border-bottom: 1px solid var(--line);
           vertical-align: top; }
  th { font-weight: 600; }
  td.state { text-align: right; white-space: nowrap; color: var(--muted); font-size: 13px; }
  ul.plain { margin: 0 0 14px; padding-left: 20px; }
  .error { color: var(--warn); margin-top: 14px; }
  iframe.paper { width: 100%; height: 420px; border: 1px solid var(--line);
                 border-radius: 8px; background: var(--bg); margin: 4px 0 18px; }
  label.check { display: flex; align-items: flex-start; gap: 4px; font-weight: 600; }
  label.check input { margin-top: 4px; }
  .good { color: var(--good); }
</style>

<main>
  <header class="bar">
    <h1>Jobloom</h1>
    <span class="spacer"></span>
    <select id="lang" aria-label="Language">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select>
  </header>
  <div class="progress" id="progress"></div>
  <section class="card" id="screen"></section>
  <datalist id="countries"></datalist>
</main>

let lang = (navigator.language || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
let app = { fields: [], answers: {}, screenGates: {}, index: 0, screen: "welcome", state: null,
            draft: null, done: null, error: "", stranded: [], carry: null,
            pdfUrl: "", reviewed: false, busy: false, restored: null };

const t = (key, vars) => {
  let out = COPY[lang][key] || key;
  for (const [name, value] of Object.entries(vars || {})) {
    out = out.replace("{" + name + "}", value);
  }
  return out;
};
const fieldCopy = (id) => FIELD_COPY[lang][id] || [id, ""];
const el = (tag, attrs, ...kids) => {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value !== null && value !== false) node.setAttribute(key, value);
  }
  for (const kid of kids) if (kid) node.append(kid);
  return node;
};

async function api(path, body) {
  const options = { headers: { "X-Jobloom-Token": TOKEN } };
  if (body !== undefined) {
    options.method = "POST";
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  const payload = await response.json().catch(() => ({ error: "unreadable" }));
  if (!response.ok) throw new Error(payload.detail || payload.error || "failed");
  return payload;
}

// ---- screens -------------------------------------------------------------------

function welcome() {
  const known = app.state.fields_in_round.filter((id) =>
    (app.fields.find((f) => f.canonical_id === id) || {}).proposed).length;
  const total = app.state.fields_in_round.length;
  return el("div", {},
    el("h2", { text: t("welcomeTitle") }),
    el("p", { text: t("welcomeBody") }),
    el("p", { text: t("welcomeAsk", { n: total }) }),
    el("p", { class: "muted", text: known ? t("welcomeKnown", { n: known }) : t("welcomeNone") }),
    el("p", { class: "muted", text: t("welcomeNothingDerived") }),
    el("footer", { class: "nav" },
      el("span", { class: "spacer" }),
      el("button", { class: "primary", text: app.state.open_round ? t("resume") : t("start"),
                     onclick: () => go("field", 0) })));
}

function screenFields() {
  const group = (app.state.screens || [])[app.index] || { fields: [] };
  return group.fields
    .map((id) => app.fields.find((field) => field.canonical_id === id))
    .filter(Boolean);
}

function fieldRow(field) {
  const answer = app.answers[field.canonical_id];
  const [label, hint] = fieldCopy(field.canonical_id);
  const inputId = `v-${field.canonical_id.replace(/\./g, "-")}`;
  const attrs = { type: "text", value: answer.value || "", id: inputId, autocomplete: "off",
                  spellcheck: "false" };
  if (field.canonical_id === "contact.country") attrs.list = "countries";
  const input = el("input", attrs);
  // Deliberately not re-rendering: this used to call render() on every keystroke, which
  // replaced the input the person was typing into and threw the caret away after each
  // letter. The model is updated in place, and the screen is only rebuilt when something
  // structural changes - a gate answered, a complaint raised, a rewrite offered.
  input.addEventListener("input", () => {
    answer.value = input.value;
    if (answer.complaint || answer.suggestion) {
      answer.complaint = "";
      answer.suggestion = "";
      rerender(inputId);
    }
  });
  const parts = [
    el("label", { class: "field", for: inputId,
                  text: label + (field.required ? " *" : "") }),
    hint ? el("p", { class: "origin", text: hint }) : null,
    input,
  ];
  if (field.proposed) parts.push(el("p", { class: "origin", text: t("proposedFrom") }));
  if (answer.complaint) parts.push(el("p", { class: "complaint", text: answer.complaint }));
  if (answer.suggestion) {
    parts.push(el("div", { class: "offer" },
      el("span", { text: t("didYouMean", { v: answer.suggestion }) + "  " }),
      el("button", { class: "link", text: t("useIt"), onclick: () => {
        answer.value = answer.suggestion;
        answer.suggestion = ""; answer.complaint = "";
        rerender(inputId);
      } }),
      el("span", { text: "  ·  " }),
      el("button", { class: "link", text: t("keepMine"),
                     onclick: () => { answer.suggestion = ""; rerender(inputId); } })));
  }
  return el("div", { class: "row" }, ...parts.filter(Boolean));
}

function fieldScreen() {
  const group = (app.state.screens || [])[app.index] || { name: "", fields: [] };
  const fields = screenFields();
  const answers = fields.map((field) => app.answers[field.canonical_id]);
  const anyValue = answers.some((answer) => (answer.value || "").trim());
  const gate = app.screenGates[group.name] || { confirmed: null, autofill: null };
  const box = el("div", {},
    el("h2", { text: t(`screen_${group.name}`) }),
    el("p", { class: "muted", text: t(`screenHint_${group.name}`) }),
    ...fields.map(fieldRow));

  box.append(el("div", { class: "gate" },
    el("p", { text: t("gateOne") }),
    el("div", { class: "choices" },
      el("button", { text: t("yes"), "aria-pressed": String(gate.confirmed === true),
                     onclick: () => setGate(group.name, true, gate.autofill) }),
      el("button", { text: t("no"), "aria-pressed": String(gate.confirmed === false),
                     onclick: () => setGate(group.name, false, false) }))));
  if (gate.confirmed === true) {
    box.append(el("div", { class: "gate" },
      el("p", { text: t("gateTwo") }),
      el("div", { class: "choices" },
        el("button", { text: t("allow"), "aria-pressed": String(gate.autofill === true),
                       onclick: () => setGate(group.name, true, true) }),
        el("button", { text: t("ask"), "aria-pressed": String(gate.autofill === false),
                       onclick: () => setGate(group.name, true, false) }))));
  } else if (gate.confirmed === false) {
    box.append(el("p", { class: "muted", text: t("screenLeftOut") }));
  }

  const ready = gate.confirmed === false
    || (gate.confirmed === true && gate.autofill !== null && anyValue);
  box.append(el("footer", { class: "nav" },
    app.index > 0 ? el("button", { text: t("back"), onclick: () => go("field", app.index - 1) })
                  : null,
    el("span", { class: "spacer" }),
    el("button", { class: "primary", text: t("next"), disabled: !ready || null,
                   onclick: advance })));
  return box;
}

function setGate(name, confirmed, autofill) {
  app.screenGates[name] = { confirmed, autofill: confirmed ? autofill : false };
  render();
}

async function advance() {
  const group = (app.state.screens || [])[app.index];
  const gate = app.screenGates[group.name];
  if (gate.confirmed) {
    // Checked by the service, field by field, with the same rule the terminal path uses.
    let complained = false;
    for (const field of screenFields()) {
      const answer = app.answers[field.canonical_id];
      if (!(answer.value || "").trim()) {
        answer.complaint = field.required ? t("requiredMissing") : "";
        complained = complained || field.required;
        continue;
      }
      const checked = await api("/api/check", { canonical_id: field.canonical_id,
                                                value: answer.value });
      answer.value = checked.value;
      answer.complaint = checked.complaint || "";
      answer.suggestion = checked.suggestion || "";
      complained = complained || !!(answer.complaint || answer.suggestion);
    }
    if (complained) return render();
  }
  if (app.index + 1 < (app.state.screens || []).length) return go("field", app.index + 1);
  return go("review");
}

function decided(canonicalId) {
  const screens = app.state.screens || [];
  const index = screens.findIndex((group) => group.fields.includes(canonicalId));
  const gate = app.screenGates[(screens[index] || {}).name] || {};
  const value = (app.answers[canonicalId] || {}).value || "";
  const confirmed = gate.confirmed === true && !!value.trim();
  return { index, confirmed, autofill: confirmed && gate.autofill === true, value };
}

function inScreenOrder() {
  const order = (app.state.screens || []).flatMap((group) => group.fields);
  return [...app.fields].sort(
    (a, b) => order.indexOf(a.canonical_id) - order.indexOf(b.canonical_id));
}

function reviewScreen() {
  const rows = inScreenOrder().map((field) => {
    const state = decided(field.canonical_id);
    const [label] = fieldCopy(field.canonical_id);
    const shown = !state.confirmed ? t("stLeftOut")
                  : state.autofill ? t("stLocked") : t("stRecorded");
    return el("tr", {},
      el("th", { text: label }),
      el("td", { text: state.confirmed ? state.value : "—" }),
      el("td", { class: "state" }, el("span", { text: shown + "  " }),
        el("button", { class: "link", text: t("edit"),
                       onclick: () => go("field", state.index) })));
  });
  const anyConfirmed = app.fields.some((f) => decided(f.canonical_id).confirmed);
  return el("div", {},
    el("h2", { text: t("reviewTitle") }),
    el("p", { class: "muted", text: t("reviewBody") }),
    el("table", {}, ...rows),
    app.error ? el("p", { class: "error", text: t("failed") + app.error }) : null,
    el("footer", { class: "nav" },
      el("button", { text: t("back"), onclick: () => go("field", app.fields.length - 1) }),
      el("span", { class: "spacer" }),
      el("button", { class: "primary", text: t("prepare"), disabled: !anyConfirmed || null,
                     onclick: prepare })));
}

async function prepare() {
  app.error = "";
  try {
    const answers = {};
    for (const field of app.fields) {
      const state = decided(field.canonical_id);
      answers[field.canonical_id] = { value: state.value, confirmed: state.confirmed,
                                      autofill: state.autofill };
    }
    await api("/api/answers", { answers });
    app.draft = await api("/api/draft", {});
    go("impact");
  } catch (error) {
    app.error = error.message;
    render();
  }
}

function impactScreen() {
  const impact = app.draft.impact_if_registered;
  const lines = [];
  if (impact.material_locks_invalidated)
    lines.push(t("impactLocks", { n: impact.material_locks_invalidated }));
  if (impact.resume_versions_needing_rebinding.length)
    lines.push(t("impactResumes", { n: impact.resume_versions_needing_rebinding.length }));
  if (impact.applications_affected.length)
    lines.push(t("impactApps", { n: impact.applications_affected.length }));
  if (impact.pre_submit_reviews_invalidated)
    lines.push(t("impactReviews", { n: impact.pre_submit_reviews_invalidated }));
  if (impact.answers_going_stale.length)
    lines.push(t("impactAnswers", { n: impact.answers_going_stale.length }));

  return el("div", {},
    el("h2", { text: t("impactTitle") }),
    el("p", { text: t("impactBody") }),
    el("p", { text: t("willAdd", { n: app.draft.facts_locked.length
                                      + app.draft.facts_recorded_only.length,
                                   m: app.draft.facts_locked.length }) }),
    lines.length
      ? el("ul", { class: "plain" }, ...lines.map((line) => el("li", { text: line })))
      : el("p", { class: "good", text: t("impactNothing") }),
    el("p", { class: "muted", text: t("registerWarn") }),
    app.error ? el("p", { class: "error", text: t("failed") + app.error }) : null,
    el("footer", { class: "nav" },
      el("button", { text: t("back"), onclick: () => go("review") }),
      el("span", { class: "spacer" }),
      el("button", { class: "primary", text: t("register"), onclick: registerDraft })));
}

async function registerDraft() {
  app.error = "";
  try {
    // The draft's hash goes back with the press, so the approval names the one draft whose
    // impact was on the screen. Nobody is asked to read 64 characters.
    app.done = await api("/api/register", { draft_sha256: app.draft.draft_sha256 });
    go("done");
  } catch (error) {
    app.error = error.message;
    render();
  }
}

function doneScreen() {
  const fillable = app.done.observed_impact.meanings_now_resolvable || [];
  const recorded = app.draft.facts_recorded_only || [];
  return el("div", {},
    el("h2", { class: "good", text: t("doneTitle") }),
    el("p", { text: t("doneBody") }),
    el("ul", { class: "plain" },
      ...fillable.map((id) => el("li", { text: fieldCopy(id)[0] }))),
    recorded.length ? el("p", { text: t("doneRecorded") }) : null,
    recorded.length ? el("ul", { class: "plain" },
      ...recorded.map((id) => el("li", { text: fieldCopy(id)[0] }))) : null,
    el("p", { class: "muted", text: t("doneNotWired") }),
    el("p", { class: "muted", text: t("doneNext") }),
    el("footer", { class: "nav" },
      el("span", { class: "spacer" }),
      el("button", { class: "primary", text: t("next"), onclick: openMigrations })));
}

// ---- carrying the resumes the new profile left behind ---------------------------

async function openMigrations() {
  app.error = "";
  try {
    app.stranded = (await api("/api/resume-migrations")).stranded;
    go("migrations");
  } catch (error) {
    app.error = error.message;
    render();
  }
}

function migrationsScreen() {
  const rows = app.stranded.map((row) => {
    const detail = [row.direction];
    if (row.lock_lost && row.application_id) detail.push(t("migrationsUrgent"));
    return el("tr", {},
      el("th", { text: row.version_id }),
      el("td", { class: "muted", text: detail.join(" · ") }),
      el("td", { class: "state" },
        row.migratable
          ? el("button", { text: row.in_progress ? t("resumeCarry") : t("carry"),
                           disabled: app.busy || null,
                           onclick: () => prepareCarry(row) })
          : el("span", { text: t("migrationsBlocked") + row.blocked_reason })));
  });
  return el("div", {},
    el("h2", { text: app.stranded.length ? t("migrationsTitle") : t("restoredTitle") }),
    el("p", { text: app.stranded.length ? t("migrationsBody") : t("migrationsNone") }),
    app.stranded.length ? el("table", {}, ...rows) : null,
    app.error ? el("p", { class: "error", text: t("failed") + app.error }) : null,
    el("footer", { class: "nav" },
      el("span", { class: "spacer" }),
      el("button", { text: t("skipMigrations"), onclick: () => go("done") })));
}

async function prepareCarry(row) {
  app.error = "";
  app.busy = true;
  render();
  try {
    if (row.in_progress) {
      // Closing the window mid-carry must not strand the carry as well. A second prepare
      // would be refused, so the one already open is picked up where it was left.
      app.carry = { successor_version_id: row.in_progress.successor_version_id,
                    application_id: row.application_id, claims: [] };
      app.reviewed = false;
      app.pdfUrl = "";
      if (row.in_progress.status === "approved") {
        go("carryBind");
      } else {
        go("carryReview");
        loadPdf();
      }
      return;
    }
    app.carry = await api("/api/resume-migrations/prepare",
                          { predecessor_version_id: row.version_id });
    app.carry.application_id = row.application_id;
    app.reviewed = false;
    app.pdfUrl = "";
    go("carryReview");
    loadPdf();
  } catch (error) {
    app.error = error.message;
  } finally {
    app.busy = false;
    render();
  }
}

async function loadPdf() {
  // Fetched with the session token, then shown from a blob inside this window. An
  // `<iframe src="/api/resume-file">` could not carry the token, and a new tab would need it
  // in a URL, where it would stay in history.
  try {
    const response = await fetch(
      `/api/resume-file?version_id=${encodeURIComponent(app.carry.successor_version_id)}`,
      { headers: { "X-Jobloom-Token": TOKEN } });
    if (!response.ok) throw new Error((await response.json()).error || "failed");
    app.pdfUrl = URL.createObjectURL(await response.blob());
  } catch (error) {
    app.error = t("reviewFailed") + error.message;
  }
  render();
}

function carryReviewScreen() {
  const claims = (app.carry.claims || []).map((claim) =>
    el("li", { text: `${claim.claim_text} — ${claim.evidence_strength}` }));
  return el("div", {},
    el("h2", { text: t("carryReviewTitle") }),
    el("p", { text: t("carryReviewBody") }),
    app.pdfUrl
      ? el("iframe", { class: "paper", src: app.pdfUrl, title: t("carryReviewTitle") })
      : el("p", { class: "muted", text: t("reviewOpening") }),
    claims.length ? el("p", { text: t("reviewClaims") }) : null,
    claims.length ? el("ul", { class: "plain" }, ...claims) : null,
    el("div", { class: "gate" },
      el("label", { class: "check" },
        el("input", { type: "checkbox", id: "reviewed",
                      checked: app.reviewed ? "checked" : false,
                      onchange: (event) => { app.reviewed = event.target.checked; render(); } }),
        el("span", { text: "  " + t("materialsGate") }))),
    app.error ? el("p", { class: "error", text: t("failed") + app.error }) : null,
    el("footer", { class: "nav" },
      el("button", { text: t("back"), onclick: () => go("migrations") }),
      el("span", { class: "spacer" }),
      el("button", { class: "primary", text: app.busy ? t("working") : t("approveMaterials"),
                     disabled: (!app.reviewed || !app.pdfUrl || app.busy) || null,
                     onclick: approveCarry })));
}

async function approveCarry() {
  app.error = "";
  app.busy = true;
  render();
  try {
    await api("/api/resume-migrations/approve", {
      successor_version_id: app.carry.successor_version_id, materials_reviewed: true });
    go("carryBind");
  } catch (error) {
    app.error = error.message;
  } finally {
    app.busy = false;
    render();
  }
}

function carryBindScreen() {
  return el("div", {},
    el("h2", { text: t("bindTitle") }),
    el("p", { text: t("bindBody") }),
    el("p", { class: "muted",
              text: `${t("bindApplication")}: ${app.carry.application_id || "—"}` }),
    app.error ? el("p", { class: "error", text: t("failed") + app.error }) : null,
    el("footer", { class: "nav" },
      el("span", { class: "spacer" }),
      el("button", { class: "primary", text: app.busy ? t("working") : t("bindNow"),
                     disabled: (!app.carry.application_id || app.busy) || null,
                     onclick: bindCarry })));
}

async function bindCarry() {
  app.error = "";
  app.busy = true;
  render();
  try {
    app.restored = await api("/api/resume-migrations/bind", {
      successor_version_id: app.carry.successor_version_id,
      application_id: app.carry.application_id });
    app.stranded = (await api("/api/resume-migrations")).stranded;
    go("restored");
  } catch (error) {
    app.error = error.message;
  } finally {
    app.busy = false;
    render();
  }
}

function restoredScreen() {
  const left = app.stranded.filter((row) => row.migratable).length;
  return el("div", {},
    el("h2", { class: "good", text: t("restoredTitle") }),
    el("p", { text: t("restoredBody") }),
    el("p", { class: "muted", text: app.restored.application_id }),
    left ? el("p", { text: t("restoredMore") }) : null,
    el("footer", { class: "nav" },
      el("span", { class: "spacer" }),
      left
        ? el("button", { class: "primary", text: t("next"), onclick: () => go("migrations") })
        : null));
}

// ---- shell ---------------------------------------------------------------------

function go(screen, index) {
  app.screen = screen;
  if (index !== undefined) app.index = index;
  app.error = "";
  render();
}

function rerender(focusId) {
  // Rebuilding the screen throws the caret away, so whatever was being typed into is given
  // back its focus and its caret. Only called where a rebuild is unavoidable.
  render();
  const field = document.getElementById(focusId);
  if (field) {
    const at = field.value.length;
    field.focus();
    field.setSelectionRange(at, at);
  }
}

function render() {
  const steps = (app.state && app.state.screens ? app.state.screens.length : 4);
  const total = steps + 3;
  const at = app.screen === "welcome" ? 0
           : app.screen === "field" ? app.index + 1
           : app.screen === "review" ? steps + 1
           : app.screen === "impact" ? steps + 2 : total;
  const progress = document.getElementById("progress");
  progress.replaceChildren(...Array.from({ length: total }, (_, i) =>
    el("i", { class: i <= at ? "done" : "" })));
  const screen = { welcome, field: fieldScreen, review: reviewScreen,
                   impact: impactScreen, done: doneScreen,
                   migrations: migrationsScreen, carryReview: carryReviewScreen,
                   carryBind: carryBindScreen, restored: restoredScreen }[app.screen];
  document.getElementById("screen").replaceChildren(screen());
}

document.getElementById("lang").addEventListener("change", (event) => {
  lang = event.target.value;
  document.documentElement.lang = lang;
  render();
});

(async function start() {
  document.getElementById("lang").value = lang;
  document.documentElement.lang = lang;
  try {
    app.state = await api("/api/state");
    const round = app.state.fields_in_round.every((id) => app.state.resolvable.includes(id))
      ? null : await api("/api/round", {});
    if (round === null) {
      // The round is answered and registered. Coming back is for what is left over.
      app.stranded = (await api("/api/resume-migrations")).stranded;
      app.fields = [];
      go("migrations");
      return;
    }
    app.fields = round.fields;
    document.getElementById("countries").replaceChildren(
      ...(round.countries || []).map((name) => el("option", { value: name })));
    for (const field of app.fields) {
      // Null gates, not false: nobody has answered yet, and a default of "no" would be an
      // answer the user did not give. They live per screen, because that is where they are
      // asked.
      app.answers[field.canonical_id] = { value: field.value || "", complaint: "",
                                          suggestion: "" };
    }
    render();
  } catch (error) {
    document.getElementById("screen").replaceChildren(
      el("p", { class: "error", text: t("failed") + error.message }));
  }
})();
</script>
