<!doctype html>
<meta charset="utf-8">
<title>Jobloom</title>
<link rel="stylesheet" href="panel.css">
<main>
  <header>
    <h1>Jobloom</h1>
    <p id="scope">Reads only the posting you have open. It does not browse, apply, or submit.</p>
  </header>

  <details id="setup">
    <summary>Connection</summary>
    <label>Bridge <input id="endpoint" type="url" value="http://127.0.0.1:8787" spellcheck="false"></label>
    <label>Token <input id="token" type="password" placeholder="printed when the bridge starts" spellcheck="false"></label>
    <button id="save">Save</button>
  </details>
  <p id="health" class="muted"></p>

  <section id="access">
    <button id="grant">Grant access to job pages</button>
    <p id="access-state" class="muted"></p>
  </section>

  <p id="status" class="muted"></p>

  <section id="result" hidden>
    <div id="verdict"></div>
    <h2 id="job-title"></h2>
    <p id="job-meta" class="muted"></p>

    <details id="page-diagnostics">
      <summary>Page reading detail</summary>
      <p id="diagnostics" class="muted"></p>
    </details>

    <details id="detail">
      <summary>Routing detail</summary>
      <ul id="directions"></ul>
    </details>

    <details id="classes-drawer">
      <summary>逐条看：你有什么、缺什么</summary>
      <section id="stated-requirements" class="group" hidden></section>
      <section id="unassessed" class="group warn" hidden></section>
      <div id="classes"></div>
    </details>

    <p class="notice" id="notice"></p>
  </section>

</main>
<script src="panel.js"></script>
