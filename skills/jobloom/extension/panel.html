<!doctype html>
<meta charset="utf-8">
<title>Jobloom</title>
<link rel="stylesheet" href="panel.css">
<main>
  <header>
    <h1>Jobloom</h1>
    <p id="scope">只读取你当前打开的岗位，不浏览、不申请、不提交。</p>
  </header>

  <details id="setup">
    <summary>连接设置</summary>
    <label>本地服务 <input id="endpoint" type="url" value="http://127.0.0.1:8787" spellcheck="false"></label>
    <label>访问令牌 <input id="token" type="password" placeholder="启动本地服务时显示" spellcheck="false"></label>
    <button id="save">保存</button>
  </details>
  <p id="health" class="muted"></p>

  <section id="access">
    <button id="grant">允许读取岗位页面</button>
    <p id="access-state" class="muted"></p>
  </section>

  <p id="status" class="muted"></p>

  <section id="result" hidden>
    <header id="job-heading">
      <h2 id="job-title"></h2>
      <p id="job-meta" class="muted"></p>
    </header>

    <div id="verdict"></div>
    <p id="why"></p>
    <p id="best-direction" class="muted" hidden></p>

    <div id="actions" role="group" aria-label="投递选择">
      <button data-choice="precision"><strong>精投</strong><span>改简历再投</span></button>
      <button data-choice="broad"><strong>广投</strong><span>直接投</span></button>
      <button data-choice="skip"><strong>不投</strong><span>跳过</span></button>
    </div>

    <details id="classes-drawer">
      <summary>逐条看：你有什么、缺什么</summary>
      <section id="stated-requirements" class="group" hidden></section>
      <section id="unassessed" class="group warn" hidden></section>
      <div id="classes"></div>

      <details id="detail">
        <summary>其他考虑过的方向</summary>
        <ul id="directions"></ul>
      </details>

      <details id="page-diagnostics" hidden>
        <summary>页面读取详情</summary>
        <p id="diagnostics" class="muted"></p>
      </details>
    </details>

    <p class="notice" id="notice"></p>
  </section>

</main>
<script src="panel.js"></script>
