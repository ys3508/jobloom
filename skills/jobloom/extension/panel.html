<!doctype html>
<meta charset="utf-8">
<title>Jobloom</title>
<link rel="stylesheet" href="panel.css">
<main>
  <header>
    <h1>Jobloom</h1>
    <label id="language-label"><span data-i18n="language"></span>
      <select id="language"><option value="en">English</option><option value="zh">中文</option></select>
    </label>
    <p id="scope" data-i18n="scope"></p>
  </header>

  <details id="setup">
    <summary data-i18n="connectionSettings"></summary>
    <label><span data-i18n="localService"></span> <input id="endpoint" type="url" value="http://127.0.0.1:8787" spellcheck="false"></label>
    <label><span data-i18n="accessToken"></span> <input id="token" type="password" spellcheck="false"></label>
    <button id="save" data-i18n="save"></button>
  </details>
  <p id="health" class="muted"></p>

  <section id="access">
    <button id="grant" data-i18n="grant"></button>
    <p id="access-state" class="muted"></p>
  </section>

  <p id="status" class="muted"></p>

  <section id="result" hidden>
    <header id="job-heading">
      <h2 id="job-title"></h2>
      <p id="job-meta" class="muted"></p>
    </header>

    <div id="verdict"></div>
    <p id="why"></p>
    <p id="best-direction" class="muted" hidden></p>

    <div id="actions" role="group">
      <button data-choice="precision"><strong data-i18n="tailorApply"></strong><span data-i18n="tailorApplySub"></span></button>
      <button data-choice="broad"><strong data-i18n="applyAsIs"></strong><span data-i18n="applyAsIsSub"></span></button>
      <button data-choice="skip"><strong data-i18n="skip"></strong><span data-i18n="skipSub"></span></button>
    </div>

    <details id="classes-drawer">
      <summary data-i18n="drawer"></summary>
      <section id="stated-requirements" class="group" hidden></section>
      <section id="unassessed" class="group warn" hidden></section>
      <div id="classes"></div>

      <details id="detail">
        <summary data-i18n="otherDirections"></summary>
        <ul id="directions"></ul>
      </details>

      <details id="page-diagnostics" hidden>
        <summary data-i18n="readingDetails"></summary>
        <p id="diagnostics" class="muted"></p>
      </details>
    </details>

    <p class="notice" id="notice"></p>
  </section>

</main>
<script src="panel.js"></script>
